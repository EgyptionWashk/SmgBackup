name: Extract Backup Zip Directly

on:
  workflow_dispatch: # يتيح لك التشغيل اليدوي من تبويب Actions

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and Extract to .github
        run: |
          echo "=== 1. الانتقال إلى مجلد .github وتنظيف المحتويات القديمة ==="
          cd .github
          
          # حذف كل شيء ما عدا ملف الـ ZIP ومجلد workflows
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name 'SmgBackup.zip' ! -name 'workflows' -exec rm -rf {} +

          echo "=== 2. فك ضغط الملف مباشرة داخل مجلد .github ==="
          # فك الضغط مباشرة هنا مع تخطي أو استبدال الملفات حسب الحاجة
          unzip -q SmgBackup.zip
          
          echo "=== 3. حفظ التغييرات ورفعها للمستودع ==="
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract SmgBackup.zip directly into .github" || echo "No changes to commit"
          git push
# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
