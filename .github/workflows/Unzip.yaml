name: Extract Backup Zip

on:
  workflow_dispatch: # يتيح لك تشغيل الأتمتة يدوياً بضغطة زر من تبويب Actions في الموقع

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean, Extract and Organize
        run: |
          echo "=== 1. الانتقال إلى مجلد .github وتنظيفه مع الاستثناءات ==="
          cd .github
          
          # حذف كل شيء ما عدا ملف الـ ZIP ومجلد workflows
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name 'SmgBackup.zip' ! -name 'workflows' -exec rm -rf {} +

          echo "=== 2. إنشاء مجلد SmgBackup وفك الضغط بداخله ==="
          mkdir -p SmgBackup
          
          # فك ضغط ملف الـ ZIP مباشرة داخل مجلد SmgBackup مع منع تكرار المسارات غير الضرورية
          unzip -q SmgBackup.zip -d SmgBackup/
          
          echo "=== 3. العودة للجذر وحفظ التغييرات على المستودع ==="
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract SmgBackup.zip into .github/SmgBackup and cleanup" || echo "No changes to commit"
          git push
