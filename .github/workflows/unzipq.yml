name: Extract Backup Zip Directly

on:
  workflow_dispatch:

# إضافة الصلاحيات هنا لتعطيل خطأ 403
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean and Extract to .github
        run: |
          echo "=== 1. تنظيف محتويات .github القديمة ==="
          cd .github
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name 'SmgBackup.zip' ! -name 'workflows' -exec rm -rf {} +

          echo "=== 2. فك ضغط الملف مباشرة داخل مجلد .github ==="
          unzip -q SmgBackup.zip
          
          echo "=== 3. حفظ التغييرات ورفعها للمستودع ==="
          cd ..
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-extract SmgBackup.zip directly into .github" || echo "No changes to commit"
          git push
